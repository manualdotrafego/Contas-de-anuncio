name: Atualizacao 6h (planilha + dashboard)
# AGENDAMENTO DESLIGADO em 07/08/2026: quem roda a cada 6h agora e a VPS
# (cron 20 */6 * * * em /root/webinar-auto). Este workflow fica so como
# backup manual, caso a VPS caia. Para rodar: aba Actions > Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - name: Atualizar planilhas e dashboard
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_all.py
