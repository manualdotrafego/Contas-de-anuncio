name: Atualizacao 6h (planilha + dashboard)
on:
  schedule:
    - cron: '5 */6 * * *'      # 00:05, 06:05, 12:05, 18:05 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - name: Atualizar planilhas e dashboard
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_all.py
