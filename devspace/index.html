const COLS=[['Criativo','nome',0],['Gasto','spend',1],['Impr','impr',0],['CPM','cpm',1],
 ['Hook','hook',2],['CTR','ctr',2],['Saida','ob',0],['PV','lpv',0],['Carrinho','atc',0],
 ['Lead','lead',0],['Checkout','ic',0],['Compra','pur',0],['Receita','rev',1],['ROAS','roas',3]];
const rows=D.slice().sort((a,b)=>b.spend-a.spend).map(x=>{
 const o={...x,hook:p(x.p3,x.impr),roas:x.spend?x.rev/x.spend:0};
 return '<tr>'+COLS.map(([,k,f])=>{
  const v=o[k];
  return `<td>${f===0?(typeof v==='string'?v:n(v)):f===1?m(v):f===2?(v||0).toFixed(2)+'%':(v||0).toFixed(2)+'x'}</td>`;
 }).join('')+'</tr>';}).join('');
document.getElementById('tab').innerHTML=
 '<thead><tr>'+COLS.map(c=>`<th>${c[0]}</th>`).join('')+'</tr></thead><tbody>'+rows+'</tbody>'+
 `<tfoot><tr><td>TOTAL</td><td>${m(sp)}</td><td>${n(im)}</td><td>${m(im?sp/im*1000:0)}</td>
  <td>${p(p3,im).toFixed(2)}%</td><td>${p(cl,im).toFixed(2)}%</td><td>${n(ob)}</td><td>${n(lpv)}</td>
  <td>${n(atc)}</td><td>${n(ld)}</td><td>${n(ic)}</td><td>${n(pu)}</td><td>${m(rev)}</td>
  <td>${(sp?rev/sp:0).toFixed(2)}x</td></tr></tfoot>`;
document.getElementById('nota').innerHTML=
 `<b>Como ler:</b> <b>Hook rate</b> = views de 3s dividido por impressoes, mede se o criativo prende no inicio. `+
 `<b>Hold</b> = quem viu 100% dividido por quem viu 3s, mede se segura ate o fim. `+
 `<b>Cliques de saida</b> sao os que realmente sairam do Meta, numero mais honesto que o CTR total. `+
 `<b>Add ao carrinho</b> aqui significa clique no botao de interesse, <b>Lead</b> e formulario enviado, `+
 `<b>Checkout</b> e abertura do checkout da Hotmart. Dados do dia corrente no fuso da conta (America/Sao_Paulo), `+
 `com a defasagem normal de atribuicao da Meta.`;
