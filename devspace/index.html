<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DevSpace · Dashboard</title><style>
:root{--bg:#111114;--sf:rgba(255,255,255,.045);--sf2:rgba(255,255,255,.075);--ln:rgba(255,255,255,.1);
--t1:#fff;--t2:#c3c2b7;--t3:#84837c;--b:#3987e5;--o:#d95926;--a:#199e70;--y:#c98500;--r:#e66767}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;padding:24px 20px 50px;
background-image:radial-gradient(900px 480px at 12% -8%,rgba(57,135,229,.14),transparent 60%),radial-gradient(760px 420px at 92% 4%,rgba(217,89,38,.10),transparent 62%)}
.wrap{max-width:1320px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
header h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
header .sb{color:var(--t3);font-size:13px;margin-top:6px}
.lv{display:inline-flex;align-items:center;gap:7px;background:rgba(25,158,112,.14);border:1px solid rgba(25,158,112,.35);color:#4fd6a4;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600}
.lv i{width:7px;height:7px;border-radius:50%;background:#4fd6a4;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
/* ---- barra de filtros ---- */
.fb{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;backdrop-filter:blur(10px);margin-bottom:22px}
.fg{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fi{display:flex;flex-direction:column;gap:6px}
.fi>label{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ps{display:flex;gap:5px;flex-wrap:wrap}
.ps button{background:var(--sf2);border:1px solid var(--ln);color:var(--t2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.ps button:hover{border-color:rgba(57,135,229,.55);color:var(--t1)}
.ps button.on{background:#fff;border-color:#fff;color:#111}
.dt{display:flex;gap:7px;align-items:center}
.dt input{background:var(--sf2);border:1px solid var(--ln);color:var(--t1);border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;color-scheme:dark}
.dt span{color:var(--t3);font-size:12px}
select{background:var(--sf2);border:1px solid var(--ln);color:var(--t1);border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:inherit;max-width:290px;color-scheme:dark}
.rs{margin-top:11px;padding-top:11px;border-top:1px solid var(--ln);font-size:12.5px;color:var(--t2);display:flex;gap:14px;flex-wrap:wrap}
.rs b{color:var(--t1)}
.warn{color:var(--y)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-bottom:16px}
.bc{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px 22px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.bc::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:var(--ac,var(--b))}
.bc .l{font-size:12px;color:var(--t3);font-weight:600}
.bc .v{font-size:34px;font-weight:800;letter-spacing:-.04em;margin-top:6px;line-height:1;color:var(--ac,var(--t1))}
.bc .s{font-size:12px;color:var(--t2);margin-top:7px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px;margin-bottom:32px}
.kc{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:12px 14px;backdrop-filter:blur(8px)}
.kc .l{font-size:10.5px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kc .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
h2{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.13em;margin:0 0 14px}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:24px;backdrop-filter:blur(10px);margin-bottom:32px}
.fs{display:flex;flex-direction:column;gap:5px;align-items:center}
.fu{width:100%;max-width:680px;display:flex;align-items:center;gap:14px}
.fu .nm{width:174px;text-align:right;font-size:13px;font-weight:600;flex-shrink:0}
.fu .nm em{display:block;font-style:normal;font-size:11px;color:var(--t3);font-weight:400}
.fu .bx{flex:1;display:flex;justify-content:center}
.fu .bd{height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;min-width:58px;transition:.2s;letter-spacing:-.01em}
.fu:hover .bd{transform:scaleY(1.1)}
.fu .rt{width:150px;font-size:12px;color:var(--t2);flex-shrink:0}
.fu .rt b{display:block;color:var(--t1);font-size:13px;font-weight:700}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:32px}
.cc{background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden;backdrop-filter:blur(10px);transition:.2s;cursor:pointer}
.cc:hover{border-color:rgba(57,135,229,.5);transform:translateY(-2px)}
.cc.sel{border-color:var(--b);box-shadow:0 0 0 2px rgba(57,135,229,.4);opacity:1}
.cc.sel .hd::before{content:'SELECIONADO';position:absolute;z-index:3;top:44px;left:11px;background:var(--b);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:99px}
.cc.dim{opacity:.4}
.cc.dim:hover{opacity:.85}
.cc.off{opacity:.62}
.cc.off:hover{opacity:1}
.cc .hd{position:relative;height:132px;background:#000;overflow:hidden}
.cc .hd img{width:100%;height:100%;object-fit:cover;opacity:.68}
.cc .hd .ov{position:absolute;inset:auto 0 0 0;padding:12px 15px;background:linear-gradient(transparent,rgba(10,10,12,.94))}
.cc .hd .nn{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .hd .ss{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{position:absolute;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;gap:8px}
.tg{background:rgba(0,0,0,.68);border:1px solid var(--ln);border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:800;backdrop-filter:blur(4px)}
.tg.on{background:rgba(25,158,112,.9);border-color:rgba(25,158,112,1);color:#fff}
.tg.of{background:rgba(230,103,103,.9);border-color:rgba(230,103,103,1);color:#fff}
.tg.on i,.tg.of i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:middle}
.mm{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln)}
.mm>div{background:rgba(17,17,20,.6);padding:11px 8px;text-align:center}
.mm .v{font-size:17px;font-weight:800;letter-spacing:-.02em}
.mm .l{font-size:9.5px;color:var(--t3);text-transform:uppercase;margin-top:2px;letter-spacing:.04em}
.rt2{padding:13px 15px 0}
.rb{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px;background:rgba(255,255,255,.06)}
.rb i{display:block;height:9px;border-radius:2px}
.rl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t3);margin-top:6px}
.sf2{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:13px 15px}
.sf2>div{background:var(--sf2);border-radius:9px;padding:7px;text-align:center}
.sf2 .v{font-size:14px;font-weight:800}.sf2 .l{font-size:9px;color:var(--t3);text-transform:uppercase;margin-top:1px}
.ac{display:flex;gap:8px;padding:2px 15px 15px}
.selchip{display:inline-flex;align-items:center;gap:9px;background:rgba(57,135,229,.16);border:1px solid rgba(57,135,229,.45);color:#9cc6f5;border-radius:99px;padding:5px 8px 5px 14px;font-size:12px;font-weight:700}
.selchip button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:99px;width:20px;height:20px;cursor:pointer;font-size:13px;line-height:1;font-family:inherit}
.selchip button:hover{background:rgba(255,255,255,.3)}
.ac a{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:12px;font-weight:700;text-decoration:none;background:#fff;color:#111}
.ac a.s{background:var(--sf2);color:var(--t1);border:1px solid var(--ln)}
.ac span{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:12px;background:rgba(255,255,255,.03);color:var(--t3)}
.tw{background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:auto;backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:rgba(255,255,255,.05);text-align:right;padding:12px;font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--t1)}
th:first-child,td:first-child{text-align:left;white-space:nowrap;font-weight:600}
td{padding:11px 12px;text-align:right;border-top:1px solid var(--ln);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.035)}
tfoot td{background:rgba(255,255,255,.06);font-weight:800;border-top:2px solid var(--b)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.nt{background:rgba(201,133,0,.09);border:1px solid rgba(201,133,0,.3);border-radius:14px;padding:15px 18px;font-size:12.5px;color:#e0c58c;line-height:1.65;margin-top:22px}
.ft{text-align:center;color:var(--t3);font-size:11.5px;margin-top:24px}
.vazio{text-align:center;color:var(--t3);padding:44px 20px;font-size:14px}
</style></head><body><div class="wrap">

 if(selAd&&!L.some(x=>x.id===selAd)) selAd=null;
 const S=selAd?L.filter(x=>x.id===selAd):L;
 const T=k=>S.reduce((s,x)=>s+(x[k]||0),0);
 const sp=T('sp'),im=T('im'),p3=T('p3'),cl=T('cl'),ob=T('ob'),pv=T('pv'),
  ca=T('ca'),ld=T('ld'),ic=T('ic'),pu=T('pu'),rv=T('rv');
 const nd=(new Date(D2)-new Date(D1))/864e5+1;
 const on=L.filter(x=>x.st==='ACTIVE').length;
 const alvo=selAd?L.find(x=>x.id===selAd):null;
 el('sb').textContent=alvo?`Vendo só: ${alvo.nome}`
  :`${L.length} criativos com gasto no período · ${on} ativos, ${L.length-on} pausados`;
 el('up').textContent='atualizado '+M.upd;
 el('rs').innerHTML=`<span>Período: <b>${br(D1)} a ${br(D2)}</b></span><span><b>${nd}</b> dia${nd>1?'s':''}</span>`+
  `<span>Investido: <b>${mo(sp)}</b></span><span>Média: <b>${mo(sp/nd)}</b>/dia</span>`+
  (nd>1?'<span class="warn">alcance e frequência não aparecem em períodos de mais de 1 dia (não somam)</span>':'')+
  (alvo?`<span class="selchip">Criativo: ${alvo.nome} · ${mo(alvo.sp)}<button id="limpa" title="Ver todos">×</button></span>`
       :(L.length>1?'<span style="color:var(--t3)">clique num criativo para ver só ele</span>':''));
 const bl=el('limpa'); if(bl) bl.onclick=e=>{e.stopPropagation();selAd=null;render()};
 if(!L.length){
  ['big','k','gr'].forEach(i=>el(i).innerHTML='');
  el('fn').innerHTML='<div class="vazio">Nenhum gasto nesse período com os filtros escolhidos.</div>';
  el('tb').innerHTML=''; return;
 }
 el('big').innerHTML=[['Investido',mo(sp),`CPM ${mo(im?sp/im*1000:0)}`,'#fff'],
  ['Page views',n(pv),`${f1(pc(pv,ob))} dos cliques de saída`,'var(--b)'],
  ['Leads',n(ld),ld?`${mo(sp/ld)} por lead`:'nenhum no período','var(--o)'],
  ['Compras',n(pu),pu?`${mo(sp/pu)} por compra`:'nenhuma no período',pu?'var(--a)':'var(--r)']]
  .map(([l,v,s,c])=>`<div class="bc" style="--ac:${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
 const kk=[['Impressões',n(im)],['Hook 3s',f1(pc(p3,im))],['CTR',f1(pc(cl,im))],
  ['Cliques saída',n(ob)],['Add carrinho',n(ca)],['Checkout',n(ic)],['Receita',mo(rv)],
  ['ROAS',(sp?rv/sp:0).toFixed(2)+'x']];
 if(nd===1) kk.splice(1,0,['Alcance',n(T('rc'))],['Frequência',(T('rc')?im/T('rc'):0).toFixed(2)]);
 el('k').innerHTML=kk.map(([l,v])=>`<div class="kc"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
 const CL=['#3987e5','#4a8fe0','#5a86c9','#d95926','#c98500','#199e70','#199e70','#199e70','#199e70'];
 const F=[['Impressões','anúncio entregue',im,null],['Views de 3s','prendeu no início',p3,im],
  ['Cliques','no anúncio',cl,im],['Cliques de saída','saiu do Meta',ob,cl],
  ['Page View','página carregou',pv,ob],['Add ao carrinho','clicou no botão',ca,pv],
  ['Lead','formulário enviado',ld,ca],['Checkout','abriu a Hotmart',ic,ld],['Compra','pagou',pu,ic]];
 el('fn').innerHTML=F.map(([l,s,v,b],i)=>{const w=im?Math.max(v/im*100,v>0?4:2):2;
  return `<div class="fu"><div class="nm">${l}<em>${s}</em></div>
  <div class="bx"><div class="bd" style="width:${w}%;background:${CL[i]}">${n(v)}</div></div>
  <div class="rt"><b>${v?mo(sp/v):'—'}</b>${b!==null?f1(pc(v,b))+' da etapa':'base'}</div></div>`}).join('');
 const SEG=[['p25','var(--b)'],['p50','var(--o)'],['p75','var(--y)'],['p100','var(--a)']];
 el('gr').innerHTML=L.map(x=>{
  const hk=pc(x.p3,x.im),hd=pc(x.p100,x.p3),ativo=x.st==='ACTIVE';
  const cls=(ativo?'':'off ')+(selAd===x.id?'sel ':(selAd?'dim ':''));
  return `<div class="cc ${cls}" data-id="${x.id}"><div class="hd">${x.img?`<img loading="lazy" decoding="async" src="${x.img}">`:''}
  <div class="tags"><span class="tg ${ativo?'on':'of'}"><i></i>${ativo?'ATIVO':'PAUSADO'}</span>
  <span class="tg">${mo(x.sp)}</span></div>
  <div class="ov"><div class="nn">${x.nome}</div><div class="ss">${x.conj}</div></div></div>
  <div class="mm"><div><div class="v" style="color:var(--y)">${mo(x.sp)}</div><div class="l">Gasto</div></div>
  <div><div class="v" style="color:var(--b)">${hk.toFixed(1)}%</div><div class="l">Hook 3s</div></div>
  <div><div class="v" style="color:${hd>=15?'var(--a)':'var(--r)'}">${hd.toFixed(1)}%</div><div class="l">Hold 100%</div></div>
  <div><div class="v">${pc(x.cl,x.im).toFixed(2)}%</div><div class="l">CTR</div></div></div>
  ${x.p3?`<div class="rt2"><div class="rb">${SEG.map(([s,c])=>`<i style="width:${pc(x[s],x.p3)}%;background:${c}"></i>`).join('')}</div>
  <div class="rl"><span>25%: ${n(x.p25)}</span><span>50%: ${n(x.p50)}</span><span>75%: ${n(x.p75)}</span><span>100%: ${n(x.p100)}</span></div></div>`:''}
  <div class="sf2"><div><div class="v">${n(x.ob)}</div><div class="l">Saída</div></div>
  <div><div class="v">${n(x.pv)}</div><div class="l">Page view</div></div>
  <div><div class="v">${n(x.ca)}</div><div class="l">Carrinho</div></div>
  <div><div class="v">${n(x.ld)}</div><div class="l">Lead</div></div>
  <div><div class="v">${n(x.ic)}</div><div class="l">Checkout</div></div>
  <div><div class="v" style="color:${x.pu?'var(--a)':'var(--t3)'}">${n(x.pu)}</div><div class="l">Compra</div></div></div>
  <div class="ac">${x.post?`<a href="${x.post}" target="_blank">Ver post</a>`:'<span>sem post</span>'}
  ${x.preview?`<a class="s" href="${x.preview}" target="_blank">Prévia</a>`:'<span>sem prévia</span>'}</div></div>`}).join('');
 el('gr').querySelectorAll('.cc').forEach(c=>c.onclick=e=>{
  if(e.target.closest('a')) return;
  const id=c.dataset.id; selAd=(selAd===id?null:id); render();
  document.querySelector('.big').scrollIntoView({behavior:'smooth',block:'start'});
 });
 const C=[['Criativo','nome',9],['Situação','st',8],['Dias','nd',0],['Gasto','sp',1],['Impr','im',0],
  ['CPM','cpm',1],['Hook','hook',2],['CTR','ctrx',2],['Saída','ob',0],['PV','pv',0],['Carrinho','ca',0],
  ['Lead','ld',0],['Checkout','ic',0],['Compra','pu',0],['Receita','rv',1],['ROAS','roas',3]];
 const R=S.map(x=>Object.assign({},x,{cpm:x.im?x.sp/x.im*1000:0,hook:pc(x.p3,x.im),
  ctrx:pc(x.cl,x.im),roas:x.sp?x.rv/x.sp:0}));
 R.sort((a,b)=>{const u=a[ordem],v=b[ordem];
  return (typeof u==='string'?u.localeCompare(v):u-v)*(asc?1:-1)});
 el('tb').innerHTML='<thead><tr>'+C.map(c=>`<th data-k="${c[1]}">${c[0]}${ordem===c[1]?(asc?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
  R.map(x=>'<tr>'+C.map(([,k,f])=>{const v=x[k];
   if(f===8) return `<td style="text-align:left"><span class="dot" style="background:${v==='ACTIVE'?'var(--a)':'var(--r)'}"></span>${v==='ACTIVE'?'Ativo':'Pausado'}</td>`;
   if(f===9) return `<td>${v}</td>`;
   return `<td>${f===0?n(v):f===1?mo(v):f===2?(v||0).toFixed(2)+'%':(v||0).toFixed(2)+'x'}</td>`}).join('')+'</tr>').join('')+
  `</tbody><tfoot><tr><td>${selAd?'SELECIONADO':'TOTAL'}</td><td style="text-align:left">${selAd?'':on+' ativos'}</td><td>${nd}</td><td>${mo(sp)}</td>
  <td>${n(im)}</td><td>${mo(im?sp/im*1000:0)}</td><td>${pc(p3,im).toFixed(2)}%</td><td>${pc(cl,im).toFixed(2)}%</td>
  <td>${n(ob)}</td><td>${n(pv)}</td><td>${n(ca)}</td><td>${n(ld)}</td><td>${n(ic)}</td><td>${n(pu)}</td>
  <td>${mo(rv)}</td><td>${(sp?rv/sp:0).toFixed(2)}x</td></tr></tfoot>`;
 el('tb').querySelectorAll('th').forEach(t=>t.onclick=()=>{
  const k=t.dataset.k; if(ordem===k)asc=!asc; else{ordem=k;asc=false} render()});
}
el('nt').innerHTML='<b>Como ler:</b> hook rate = views de 3s sobre impressões, mede se prende no início. Hold = quem viu 100% sobre quem viu 3s. Cliques de saída são os que realmente saíram do Meta, mais honesto que o CTR total. Add ao carrinho = clique no botão de interesse, lead = formulário enviado, checkout = abertura da Hotmart. A situação (ativo/pausado) é a de agora, não a do período escolhido. Fuso da conta: America/Sao_Paulo.';
el('ft').textContent='manualdotrafego · act_592324092832640 · histórico de '+M.dias+' dias · atualização automática a cada 2h pela VPS';
aplicaPreset('hoje'); render();
</script></body></html>
